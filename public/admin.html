<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WIP &amp; SIP Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>WIP <span class="amp">&amp;</span> SIP</h1>
      <div class="sub">Admin</div>
    </div>
    <nav aria-label="Pages">
      <a class="tab" href="/">Game</a>
      <a class="tab" href="/leaderboard">Leaderboard</a>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
(function () {
  var main = document.getElementById("main");
  var code = "", cfg = null, words = [], usage = {}, rows = new Map(), busy = new Set(), es = null;
  var listEl = null, countEl = null, noteEl = null;
  try { code = sessionStorage.getItem("wipsip-admin") || ""; } catch (e) {}

  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === false || v == null) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(c));
    }
    return el;
  }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "x-admin-code": code }, opts.headers || {});
    opts.cache = "no-store";
    return fetch(path, opts);
  }
  function remember(v) { try { if (v) sessionStorage.setItem("wipsip-admin", v); else sessionStorage.removeItem("wipsip-admin"); } catch (e) {} }
  function pointsSelect(value, label) {
    var sel = h("select", { "aria-label": label });
    for (var v = cfg.pointsMin; v <= cfg.pointsMax; v += cfg.pointsStep) sel.append(h("option", { value: String(v), text: String(v) }));
    sel.value = String(value);
    return sel;
  }

  function signOut(msg) {
    code = ""; remember("");
    if (es) { es.close(); es = null; }
    loginView(msg || "");
  }

  /* ---------- sign in ---------- */
  function loginView(message) {
    main.replaceChildren();
    var input = h("input", { type: "password", id: "acode", autocomplete: "current-password", placeholder: "Admin code" });
    var err = h("div", { class: "err", role: "alert", text: message || "" });
    var btn = h("button", { class: "btn", type: "submit" }, "Open admin");
    var form = h("form", { class: "join", onsubmit: function (e) {
      e.preventDefault();
      if (!input.value) { err.textContent = "Enter the admin code."; return; }
      code = input.value; btn.disabled = true; err.textContent = "";
      check(function (ok, text) {
        btn.disabled = false;
        if (ok) { remember(code); showAdmin(); } else { code = ""; err.textContent = text; }
      });
    } },
      h("div", { class: "field" }, h("label", { class: "lbl", for: "acode", text: "Admin code" }), input),
      err, btn);
    main.append(h("section", { class: "panel" },
      h("h2", { text: "Manage the phrases." }),
      h("p", { text: "Enter the admin code that was set as ADMIN_CODE on the server." }),
      form));
    input.focus();
  }
  function check(done) {
    api("/api/admin/check").then(function (r) {
      if (r.ok) return done(true);
      r.json().then(function (d) { done(false, d.error || "Could not sign in."); }, function () { done(false, "Could not sign in."); });
    }, function () { done(false, "Could not reach the server. Check your connection."); });
  }

  /* ---------- talking to the server ---------- */
  function change(body, onError) {
    return api("/api/admin/words", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { r: r, d: d }; }); })
      .then(function (x) {
        if (x.r.status === 401) { signOut(x.d.error || "That admin code is not right."); return false; }
        if (!x.r.ok) { onError(x.d.error || "Not saved."); return false; }
        words = x.d.words || words;
        return true;
      }, function () { onError("Could not reach the server. Check your connection."); return false; });
  }

  /* ---------- editor ---------- */
  function showAdmin() {
    main.replaceChildren();
    main.append(h("section", { class: "panel" }, h("p", { text: "Loading phrases..." })));
    fetch("/api/config", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (c) {
      cfg = c; words = c.words;
      drawEditor();
      es = new EventSource("/api/stream");
      es.onmessage = function (e) {
        try {
          var m = JSON.parse(e.data);
          usage = {};
          (m.players || []).forEach(function (p) { (p.cells || []).forEach(function (w) { usage[w] = (usage[w] || 0) + 1; }); });
          if (m.words) words = m.words;
          syncList();
        } catch (x) {}
      };
    }).catch(function () { signOut("Could not load the phrases. Reload the page and try again."); });
  }

  function drawEditor() {
    main.replaceChildren();
    rows = new Map();
    noteEl = h("div", { class: "status", "aria-live": "polite", style: "min-height:0" });
    countEl = h("span", { class: "count" });
    var exportBox = h("div", { hidden: true });
    listEl = h("ul", { class: "alist" });

    // Add a phrase
    var addText = h("input", { type: "text", id: "newword", maxlength: String(cfg.maxWord || 40), autocomplete: "off", placeholder: "New phrase" });
    var addPts = pointsSelect(10, "Points for the new phrase");
    var addErr = h("div", { class: "err", role: "alert" });
    var addBtn = h("button", { class: "btn", type: "submit" }, "Add");
    var addForm = h("form", { class: "addrow", onsubmit: function (e) {
      e.preventDefault();
      var t = addText.value.trim();
      if (!t) { addErr.textContent = "Type the phrase to add."; return; }
      addBtn.disabled = true; addErr.textContent = "";
      change({ action: "add", text: t, points: Number(addPts.value) }, function (m) { addErr.textContent = m; })
        .then(function (ok) {
          addBtn.disabled = false;
          if (!ok) return;
          addText.value = ""; addText.focus();
          syncList();
          noteEl.textContent = "Added. New cards can include it straight away.";
        });
    } }, addText, addPts, addBtn);

    var copy = h("button", { class: "btn ghost", type: "button", onclick: function () {
      var text = "[\n" + words.map(function (w) { return "  " + JSON.stringify({ text: w.text, points: w.points }); }).join(",\n") + "\n]\n";
      exportBox.replaceChildren(); exportBox.hidden = true;
      var done = function () { noteEl.textContent = "Copied. Paste it over words.json and redeploy to keep this list after a restart."; };
      var fallback = function () {
        var ta = h("textarea", { class: "export", "aria-label": "words.json contents", readonly: true });
        ta.value = text; exportBox.append(ta); exportBox.hidden = false; ta.focus(); ta.select();
        noteEl.textContent = "Select all, copy, then paste it over words.json.";
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } }, "Copy as words.json");
    var out = h("button", { class: "btn ghost", type: "button", onclick: function () { signOut(); } }, "Sign out");

    main.append(h("section", { style: "display:flex;flex-direction:column;gap:16px" },
      h("div", { class: "panel" },
        h("h2", { text: "Phrases and points" }),
        h("p", { text: cfg.saved
          ? "Click a phrase to rename it (Enter saves), pick its points (" + cfg.pointsMin + " to " + cfg.pointsMax + "), or remove it. Changes save straight away, re-score everyone and are kept after a restart."
          : "Click a phrase to rename it (Enter saves), pick its points (" + cfg.pointsMin + " to " + cfg.pointsMax + "), or remove it. Changes save straight away and re-score everyone, but go back to words.json when the service restarts, so use Copy as words.json to keep them." })),
      h("div", { class: "panel" },
        h("label", { class: "lbl", for: "newword", text: "Add a phrase" }), addForm, addErr),
      h("div", { class: "toolbar" }, countEl, copy, out),
      noteEl, exportBox, listEl));
    syncList();
  }

  // Brings the list in line with `words`, keeping any row that is mid-edit untouched.
  function syncList() {
    if (!listEl) return;
    var keep = new Set(words.map(function (w) { return w.text; }));
    rows.forEach(function (row, text) {
      if (!keep.has(text) && !busy.has(row)) { row.li.remove(); rows.delete(text); }
    });
    words.forEach(function (w, i) {
      var row = rows.get(w.text);
      if (!row) { row = makeRow(w); rows.set(w.text, row); }
      if (!busy.has(row)) {
        if (document.activeElement !== row.input) row.input.value = w.text;
        if (document.activeElement !== row.sel) row.sel.value = String(w.points);
      }
      var n = usage[w.text] || 0;
      row.use.textContent = n ? "on " + n + (n === 1 ? " card" : " cards") : "";
      if (listEl.children[i] !== row.li) listEl.insertBefore(row.li, listEl.children[i] || null);
    });
    countEl.textContent = words.length + " phrases (cards need " + (cfg.cardSize || 25) + ")";
  }

  function makeRow(w) {
    var row = { word: w.text };
    var input = h("input", { type: "text", class: "t", maxlength: String(cfg.maxWord || 40), "aria-label": "Phrase text", value: w.text });
    var sel = pointsSelect(w.points, "Points for " + w.text);
    var st = h("span", { class: "st", "aria-live": "polite" });
    var use = h("span", { class: "use" });
    var saveBtn = h("button", { class: "btn mini", type: "button", hidden: true }, "Save");
    var delBtn = h("button", { class: "btn ghost mini", type: "button", "aria-label": "Remove " + w.text }, "Remove");
    var armed = false;

    function status(text, bad) { st.className = "st" + (bad ? " bad" : ""); st.textContent = text; }
    function dirty() { saveBtn.hidden = input.value.trim().replace(/\s+/g, " ") === row.word; }
    function saveText() {
      var t = input.value.trim().replace(/\s+/g, " ");
      if (t === row.word) { saveBtn.hidden = true; return; }
      if (!t) { status("Can't be blank", true); return; }
      busy.add(row); saveBtn.disabled = true; status("Saving...");
      change({ action: "edit", word: row.word, text: t }, function (m) { status(m, true); }).then(function (ok) {
        busy.delete(row); saveBtn.disabled = false;
        if (!ok) return;
        rows.delete(row.word);
        var found = words.filter(function (x) { return x.text.toLowerCase() === t.toLowerCase(); })[0];
        row.word = found ? found.text : t;
        rows.set(row.word, row);
        input.value = row.word; sel.setAttribute("aria-label", "Points for " + row.word);
        delBtn.setAttribute("aria-label", "Remove " + row.word);
        saveBtn.hidden = true;
        status("Saved");
        setTimeout(function () { if (st.textContent === "Saved") status(""); }, 1800);
        syncList();
      });
    }
    input.addEventListener("input", dirty);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); saveText(); }
      if (e.key === "Escape") { input.value = row.word; dirty(); }
    });
    saveBtn.addEventListener("click", saveText);

    sel.addEventListener("change", function () {
      var before = (words.filter(function (x) { return x.text === row.word; })[0] || {}).points;
      busy.add(row); status("Saving...");
      change({ action: "edit", word: row.word, points: Number(sel.value) }, function (m) { status(m, true); }).then(function (ok) {
        busy.delete(row);
        if (!ok) { if (before) sel.value = String(before); return; }
        status("Saved");
        setTimeout(function () { if (st.textContent === "Saved") status(""); }, 1800);
      });
    });

    delBtn.addEventListener("click", function () {
      if (!armed) {
        armed = true; delBtn.textContent = "Tap to confirm"; delBtn.classList.add("danger");
        setTimeout(function () { armed = false; delBtn.textContent = "Remove"; delBtn.classList.remove("danger"); }, 3000);
        return;
      }
      busy.add(row); delBtn.disabled = true; status("Removing...");
      change({ action: "delete", word: row.word }, function (m) { status(m, true); }).then(function (ok) {
        busy.delete(row); delBtn.disabled = false;
        if (!ok) return;
        noteEl.textContent = "Removed \u201c" + row.word + "\u201d. Cards that already have it keep the square and its points.";
        syncList();
      });
    });

    row.input = input; row.sel = sel; row.use = use;
    row.li = h("li", { class: "arow" },
      h("div", { class: "tcol" }, input, h("div", { class: "info" }, use, st)),
      saveBtn, sel, delBtn);
    return row;
  }

  if (code) {
    check(function (ok) { if (ok) showAdmin(); else { code = ""; remember(""); loginView(""); } });
  } else {
    loginView("");
  }
})();
</script>
</body>
</html>
